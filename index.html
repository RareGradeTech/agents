<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rare Grade | Agent Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet"/>
  <style>
    :root {
      --bg-main: #f0f4f9; --bg-surface: #ffffff; --text-main: #1f1f1f; --text-dim: #444746; --border: #e3e3e3;
      --accent: #0b57d0; --accent-light: #d3e3fd; --danger: #b3261e; --success: #146c2e; --warning: #b37400;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    
    /* Login Overlay */
    #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .login-card { background: var(--bg-surface); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); text-align: center; }
    .login-card h2 { margin-bottom: 8px; font-size: 1.5rem; }
    .login-card p { color: var(--text-dim); margin-bottom: 24px; font-size: 0.95rem; }
    .login-card input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; font-family: 'Inter'; outline: none; transition: 0.2s; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .login-card button:hover { background: #0842a0; }

    /* Dashboard Layout */
    .sidebar { width: 340px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .sidebar-header .icon { width: 40px; height: 40px; background: var(--accent); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .sidebar-header h1 { font-size: 1.25rem; font-weight: 600; }
    .sidebar-header p { font-size: 0.8rem; color: var(--text-dim); }
    
    .chat-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-item { padding: 16px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; background: var(--bg-surface); }
    .chat-item:hover { background: var(--bg-main); }
    .chat-item.active-selection { border-color: var(--accent); background: #f8fafd; }
    .chat-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .chat-item-name { font-weight: 600; font-family: 'Outfit'; font-size: 1.05rem; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 99px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-badge.queued { background: #fff3e0; color: var(--warning); }
    .status-badge.active { background: #e6f4ea; color: var(--success); }
    .status-badge.ended { background: #f1f3f4; color: var(--text-dim); }
    .chat-item-context { font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
    .chat-item-context .material-symbols-rounded { font-size: 16px; }

    /* Main Chat Area */
    .main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .no-chat-selected { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); }
    .no-chat-selected .material-symbols-rounded { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    
    .chat-window { flex: 1; display: flex; flex-direction: column; display: none; }
    .chat-header { padding: 24px 32px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .client-info h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .client-info p { font-size: 0.9rem; color: var(--text-dim); }
    .end-chat-btn { padding: 8px 16px; background: #fff; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .end-chat-btn:hover { background: var(--danger); color: white; }

    .messages-container { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
    .msg-bubble { padding: 14px 20px; border-radius: 20px; max-width: 60%; font-size: 0.95rem; line-height: 1.5; }
    .msg-bubble.system { align-self: center; background: none; color: var(--text-dim); font-size: 0.8rem; text-align: center; }
    .msg-bubble.user { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; } /* User is on left for agent */
    .msg-bubble.agent { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; } /* Agent is on right */
    
    .input-area { padding: 24px 32px; background: var(--bg-surface); border-top: 1px solid var(--border); display: flex; gap: 16px; }
    .chat-input { flex: 1; background: var(--bg-main); border: 1px solid transparent; border-radius: 99px; padding: 16px 24px; font-family: 'Inter'; font-size: 1rem; outline: none; transition: 0.2s; }
    .chat-input:focus { border-color: var(--accent); background: #fff; }
    .send-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .send-btn:hover { background: #0842a0; transform: scale(1.05); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Agent Login Overlay -->
  <div id="loginOverlay">
    <div class="login-card">
      <div style="background: var(--accent); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; margin: 0 auto 16px;">
        <span class="material-symbols-rounded" style="font-size: 28px;">support_agent</span>
      </div>
      <h2>Agent Login</h2>
      <p>Enter your name to join the support queue.</p>
      <input type="text" id="agentNameInput" placeholder="e.g. Sarah (Tier 1 Support)" onkeypress="if(event.key==='Enter') loginAgent()" />
      <button onclick="loginAgent()">Go Online</button>
    </div>
  </div>

  <!-- Sidebar Queue -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="icon"><span class="material-symbols-rounded">admin_panel_settings</span></div>
      <div>
        <h1>Support Desk</h1>
        <p id="agentStatusLabel">Offline</p>
      </div>
    </div>
    <div class="chat-list" id="chatList">
      <!-- Chat items will generate here -->
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="main-area">
    <div class="no-chat-selected" id="noChatState">
      <span class="material-symbols-rounded">forum</span>
      <h2>Select a chat to begin</h2>
      <p>New support requests will appear in the queue.</p>
    </div>
    
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">
        <div class="client-info">
          <h2 id="headerClientName">Client Name</h2>
          <p id="headerClientEmail">client@email.com</p>
        </div>
        <button class="end-chat-btn" onclick="closeCurrentChat()">End Session</button>
      </div>
      <div class="messages-container" id="messagesContainer">
        <!-- Messages populate here -->
      </div>
      <div class="input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your reply to the client..." onkeypress="if(event.key==='Enter') sendAgentMessage()" disabled />
        <button class="send-btn" id="sendBtn" onclick="sendAgentMessage()" disabled><span class="material-symbols-rounded">send</span></button>
      </div>
    </div>
  </div>

<script type="module">
  // FIREBASE IMPORTS
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, onChildAdded, push, update, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Firebase Init (Using the EXACT SAME config as your client)
  const app = initializeApp({
    apiKey:"AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
    authDomain:"fire-b-a8878.firebaseapp.com",
    projectId:"fire-b-a8878",
    databaseURL:"https://fire-b-a8878-default-rtdb.firebaseio.com",
    appId:"1:658673187627:web:6e4c29af661785f0afa36e"
  });
  
  const db = getDatabase(app);

  // App State
  let myAgentName = "Agent";
  let activeChatId = null;
  let activeMessagesRef = null;
  let messagesListener = null;

  // DOM Elements
  const els = {
    loginOverlay: document.getElementById('loginOverlay'),
    agentNameInput: document.getElementById('agentNameInput'),
    agentStatusLabel: document.getElementById('agentStatusLabel'),
    chatList: document.getElementById('chatList'),
    noChatState: document.getElementById('noChatState'),
    chatWindow: document.getElementById('chatWindow'),
    headerClientName: document.getElementById('headerClientName'),
    headerClientEmail: document.getElementById('headerClientEmail'),
    messagesContainer: document.getElementById('messagesContainer'),
    chatInput: document.getElementById('chatInput'),
    sendBtn: document.getElementById('sendBtn')
  };

  // 1. Agent Login
  window.loginAgent = () => {
    const name = els.agentNameInput.value.trim();
    if (!name) return alert("Please enter a name.");
    
    myAgentName = name;
    els.loginOverlay.style.display = 'none';
    els.agentStatusLabel.innerText = `Online as ${myAgentName}`;
    
    startListeningToQueue();
  };

  // 2. Listen to all chats in the Database
  function startListeningToQueue() {
    const chatsRef = ref(db, 'chats');
    onValue(chatsRef, (snapshot) => {
      els.chatList.innerHTML = ''; // Clear list
      const chatsData = snapshot.val();
      
      if (!chatsData) return;

      // Convert object to array and sort (newest queued at the top usually)
      const chatArray = Object.values(chatsData).sort((a, b) => b.createdAt - a.createdAt);

      chatArray.forEach(chat => {
        // Build Sidebar Item
        const chatItem = document.createElement('div');
        chatItem.className = `chat-item ${activeChatId === chat.id ? 'active-selection' : ''}`;
        
        let icon = chat.context.includes('AI') ? 'robot_2' : 'person';
        
        chatItem.innerHTML = `
          <div class="chat-item-header">
            <span class="chat-item-name">${chat.customerName || 'Unknown User'}</span>
            <span class="status-badge ${chat.status}">${chat.status}</span>
          </div>
          <div class="chat-item-context">
            <span class="material-symbols-rounded">${icon}</span> ${chat.context}
          </div>
        `;
        
        // On click, open the chat
        chatItem.onclick = () => openChat(chat);
        els.chatList.appendChild(chatItem);
      });
    });
  }

  // 3. Open a specific chat
  function openChat(chat) {
    // If we are already listening to a chat, stop listening to avoid duplicates
    if (activeMessagesRef && messagesListener) {
      off(activeMessagesRef, 'child_added', messagesListener);
    }

    activeChatId = chat.id;
    els.noChatState.style.display = 'none';
    els.chatWindow.style.display = 'flex';
    
    // Update Header
    els.headerClientName.innerText = chat.customerName || 'Unknown User';
    els.headerClientEmail.innerText = chat.customerEmail || 'No email provided';
    els.messagesContainer.innerHTML = ''; // Clear old messages
    
    // Enable/Disable input based on status
    const isActive = chat.status !== 'ended';
    els.chatInput.disabled = !isActive;
    els.sendBtn.disabled = !isActive;
    if (isActive) els.chatInput.focus();

    // If chat is queued, set it to active and assign this agent
    if (chat.status === 'queued') {
      update(ref(db, `chats/${chat.id}`), {
        status: 'active',
        agentName: myAgentName
      });
    }

    // 4. Listen for messages in THIS specific chat
    activeMessagesRef = ref(db, `chats/${chat.id}/messages`);
    messagesListener = onChildAdded(activeMessagesRef, (snapshot) => {
      const msg = snapshot.val();
      appendMessageUI(msg.text, msg.sender);
    });
    
    // Re-render sidebar to update the selected background color
    startListeningToQueue();
  }

  // 5. Send Agent Message
  window.sendAgentMessage = () => {
    const text = els.chatInput.value.trim();
    if (!text || !activeChatId) return;

    // Push to database
    push(ref(db, `chats/${activeChatId}/messages`), {
      text: text,
      sender: 'agent',
      timestamp: Date.now()
    });

    els.chatInput.value = '';
  };

  // 6. UI Message Append
  function appendMessageUI(text, sender) {
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble ${sender}`;
    bubble.innerText = text;
    els.messagesContainer.appendChild(bubble);
    els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
  }

  // 7. End Chat manually
  window.closeCurrentChat = () => {
    if (!activeChatId) return;
    if (confirm("Are you sure you want to end this session?")) {
      update(ref(db, `chats/${activeChatId}`), {
        status: 'ended'
      });
      els.chatInput.disabled = true;
      els.sendBtn.disabled = true;
      appendMessageUI("You have closed this chat session.", "system");
    }
  };

</script>
</body>
</html>
