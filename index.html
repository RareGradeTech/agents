<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow">
    
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Hello, World!</h1>
        <p class="text-gray-500 mt-1">This is a simple HTML page</p>
      </div>
      <button onclick="changeMessage()" 
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        Click Me
      </button>
    </div>

    <!-- Content -->
    <div class="mt-8">
      <h2 class="text-xl font-semibold mb-4">Features</h2>
      <ul class="space-y-3 text-gray-700">
        <li class="flex items-center gap-2">
          <span class="text-green-500">✓</span> Clean and responsive design
        </li>
        <li class="flex items-center gap-2">
          <span class="text-green-500">✓</span> Includes Tailwind CSS
        </li>
        <li class="flex items-center gap-2">
          <span class="text-green-500">✓</span> Simple JavaScript interaction
        </li>
      </ul>
    </div>

    <!-- Footer -->
    <div class="mt-8 pt-4 border-t text-sm text-gray-500">
      Made with simple HTML + Tailwind
    </div>
  </div>

  <script>
    function changeMessage() {
      const heading = document.querySelector('h1');
      heading.textContent = 'Thanks for clicking!';
      heading.classList.add('text-blue-600');
    }
  </script>
</body>
</html>
