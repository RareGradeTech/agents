<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RareGrade Support Desk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: #475569; }

        .msg-bubble { max-width: 80%; padding: 10px 14px; font-size: 0.9rem; line-height: 1.4; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-client { border-radius: 12px 12px 12px 0; background-color: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
        .dark .msg-client { background-color: #1e293b; color: #f8fafc; border-color: #334155; }
        .msg-agent { border-radius: 12px 12px 0 12px; background-color: #2563eb; color: #ffffff; }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading .spinner { display: inline-block; }
        .loading .btn-text { display: none; }
    </style>
</head>
<body class="h-screen flex bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 z-50 bg-gray-50 dark:bg-slate-900 flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200 dark:border-slate-700 text-center">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 dark:text-blue-400">
                <i class="fa-solid fa-headset text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Support Desk Login</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Enter your employee PIN to access the queue.</p>
            
            <div class="space-y-4">
                <input type="password" id="emp-pin-input" placeholder="Enter PIN" class="w-full p-4 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl text-center text-xl tracking-widest font-mono focus:ring-2 focus:ring-blue-500 outline-none transition dark:text-white" inputmode="numeric" maxlength="6" onkeypress="if(event.key === 'Enter') authenticateAgent()">
                <button id="login-btn" onclick="authenticateAgent()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-md flex justify-center items-center gap-2 active:scale-95">
                    <span class="btn-text">Join Workspace</span>
                    <div class="spinner"></div>
                </button>
            </div>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden font-medium">Invalid PIN. Please try again.</p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="flex w-full h-full hidden opacity-0 transition-opacity duration-500">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-80 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col shrink-0 h-full relative z-20 transition-transform" id="sidebar">
            <div class="p-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50/50 dark:bg-slate-800">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-bold text-xs">RG</div>
                    <div>
                        <h2 class="font-bold text-sm leading-tight">Support Queue</h2>
                        <p id="work-status" class="text-[10px] text-green-500 font-bold flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Available
                        </p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fa-solid fa-moon"></i></button>
                    <button onclick="logoutAgent()" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto chat-scroll p-2 space-y-1" id="chat-list">
                <div class="p-4 text-center text-xs text-gray-400 italic mt-10">Syncing queue...</div>
            </div>
            
            <div class="p-3 border-t border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-900 flex items-center gap-3">
                <img id="agent-avatar" src="" class="w-10 h-10 rounded-full border-2 border-white dark:border-slate-700 shadow-sm object-cover">
                <div>
                    <p class="text-xs font-bold" id="agent-name">Agent Name</p>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wide">Support Technician</p>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="flex-1 bg-gray-50 dark:bg-slate-900 flex flex-col h-full relative" id="chat-main">
            <button onclick="toggleMobileSidebar()" id="mobile-back-btn" class="md:hidden absolute top-4 left-4 z-30 w-10 h-10 bg-white dark:bg-slate-800 rounded-full shadow border border-gray-200 dark:border-slate-700 flex items-center justify-center hidden">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <header id="chat-header" class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 flex items-center px-6 md:px-6 pl-16 md:pl-6 shrink-0 hidden">
                <div class="flex justify-between items-center w-full">
                    <div>
                        <h2 class="font-bold text-gray-800 dark:text-gray-100" id="current-client-name">Select a chat</h2>
                        <p class="text-xs text-gray-500" id="current-chat-status">--</p>
                    </div>
                    <button onclick="resolveChat()" id="btn-resolve" class="text-xs font-bold px-3 py-1.5 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-md hover:bg-green-200 transition">
                        Mark Resolved
                    </button>
                </div>
            </header>

            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-gray-600">
                <i class="fa-regular fa-comments text-6xl mb-4 opacity-50"></i>
                <p class="text-sm font-medium">Select a client chat from the queue to begin</p>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto chat-scroll p-4 md:p-6 space-y-4 hidden pb-24"></div>

            <div id="chat-input-area" class="bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 p-4 absolute bottom-0 left-0 right-0 hidden">
                <div class="flex items-end gap-2 max-w-4xl mx-auto">
                    <button class="p-3 text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-paperclip"></i></button>
                    <textarea id="message-input" rows="1" placeholder="Type a message..." class="flex-1 p-3 bg-gray-100 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl resize-none outline-none focus:border-blue-500 transition text-sm dark:text-white" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'" onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
                    <button onclick="sendMessage()" class="w-12 h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md transition active:scale-95 mb-[1px] shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCh7Ute6LeSAxcNDEQwZg5m0cA4ujnLCfg",
            authDomain: "test-17881.firebaseapp.com",
            projectId: "test-17881",
            storageBucket: "test-17881.firebasestorage.app",
            messagingSenderId: "1057428047643",
            appId: "1:1057428047643:web:f3801c0d933225a5cd35be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentAgent = null;
        let activeChatId = null;
        let activeChatRef = null;
        let isBusy = false;

        function toggleTheme() { document.documentElement.classList.toggle('dark'); }

        async function authenticateAgent() {
            const pinInput = document.getElementById('emp-pin-input').value.trim();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            if(!pinInput) return;
            btn.classList.add('loading');
            try {
                const snap = await db.ref('employees').orderByChild('employeeNumber').equalTo(pinInput).once('value');
                if (snap.exists()) {
                    const data = snap.val();
                    const key = Object.keys(data)[0];
                    currentAgent = { ...data[key], id: key };
                    document.getElementById('agent-name').innerText = currentAgent.name;
                    document.getElementById('agent-avatar').src = currentAgent.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentAgent.name)}&background=2563eb&color=fff`;
                    document.getElementById('login-overlay').classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        document.getElementById('login-overlay').classList.add('hidden');
                        document.getElementById('dashboard').classList.remove('hidden');
                        setTimeout(() => document.getElementById('dashboard').classList.remove('opacity-0'), 50);
                    }, 500);
                    listenToQueue();
                } else { err.classList.remove('hidden'); }
            } catch (e) { console.error(e); } finally { btn.classList.remove('loading'); }
        }

        function listenToQueue() {
            db.ref('live_support_chats').on('value', (snap) => {
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                if (!snap.exists()) {
                    list.innerHTML = '<div class="p-4 text-center text-xs text-gray-400 italic mt-10">No active requests.</div>';
                    return;
                }

                let chats = [];
                snap.forEach(child => { chats.push({ id: child.key, ...child.val() }); });

                // Logic: Check if I am busy
                const myActiveChat = chats.find(c => c.agentId === currentAgent.id && c.status === 'active');
                isBusy = !!myActiveChat;
                updateWorkStatusUI(isBusy);

                const visibleChats = chats.filter(chat => {
                    if (chat.agentId === currentAgent.id) return true;
                    if (!chat.agentId && chat.status !== 'resolved' && !isBusy) return true;
                    return false;
                });

                visibleChats.sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0));

                visibleChats.forEach(chat => {
                    const isResolved = chat.status === 'resolved';
                    const isPending = !chat.agentId;
                    let badge = '';
                    if (isPending) badge = '<span class="px-2 py-0.5 bg-orange-100 text-orange-600 dark:bg-orange-900/30 text-[9px] rounded font-bold uppercase">Pending</span>';
                    else if (isResolved) badge = '<span class="px-2 py-0.5 bg-gray-100 text-gray-500 dark:bg-slate-700 text-[9px] rounded font-bold uppercase">Resolved</span>';
                    else badge = '<span class="px-2 py-0.5 bg-green-100 text-green-600 dark:bg-green-900/30 text-[9px] rounded font-bold uppercase">Active</span>';

                    const activeClass = activeChatId === chat.id ? 'bg-blue-50 border-blue-200 dark:bg-slate-700 dark:border-blue-500/50' : 'border-transparent hover:bg-gray-100 dark:hover:bg-slate-700/50';
                    list.innerHTML += `
                        <div onclick="openChat('${chat.id}')" class="p-3 border-b border-gray-100 dark:border-slate-700/50 cursor-pointer transition-all rounded-lg mb-1 border ${activeClass}">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-sm text-gray-800 dark:text-gray-200 truncate pr-2">${chat.clientName || 'Client'}</h3>
                                ${badge}
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${chat.lastMessage || 'New...'}</p>
                        </div>`;
                });
            });
        }

        function updateWorkStatusUI(busy) {
            const statusBox = document.getElementById('work-status');
            if (busy) {
                statusBox.innerHTML = '<span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span> In Session (Busy)';
                statusBox.className = "text-[10px] text-red-500 font-bold flex items-center gap-1";
            } else {
                statusBox.innerHTML = '<span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Available';
                statusBox.className = "text-[10px] text-green-500 font-bold flex items-center gap-1";
            }
        }

        async function openChat(chatId) {
            activeChatId = chatId;
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('mobile-back-btn').classList.remove('hidden');
            }
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('messages-container').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');

            const snap = await db.ref(`live_support_chats/${chatId}`).once('value');
            const chatData = snap.val();
            document.getElementById('current-client-name').innerText = chatData.clientName;
            document.getElementById('current-chat-status').innerText = `Ref: ${chatId.substring(0,8).toUpperCase()}`;

            if (!chatData.agentId && chatData.status !== 'resolved') {
                await db.ref(`live_support_chats/${chatId}`).update({
                    agentId: currentAgent.id,
                    agentName: currentAgent.name,
                    status: 'active'
                });
            }

            const btnResolve = document.getElementById('btn-resolve');
            const inputArea = document.getElementById('chat-input-area');
            const msgInput = document.getElementById('message-input');
            if (chatData.status === 'resolved') {
                btnResolve.style.display = 'none';
                inputArea.style.opacity = '0.5';
                msgInput.disabled = true;
            } else {
                btnResolve.style.display = 'block';
                inputArea.style.opacity = '1';
                msgInput.disabled = false;
            }

            if (activeChatRef) activeChatRef.off();
            activeChatRef = db.ref(`live_support_chats/${chatId}/messages`);
            const msgContainer = document.getElementById('messages-container');
            msgContainer.innerHTML = '';
            activeChatRef.on('child_added', (msgSnap) => {
                const msg = msgSnap.val();
                const isAgent = msg.sender === 'agent';
                const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const html = `
                    <div class="flex flex-col ${isAgent ? 'items-end' : 'items-start'}">
                        <span class="text-[10px] text-gray-400 mb-1 px-1">${isAgent ? currentAgent.name : chatData.clientName}</span>
                        <div class="msg-bubble ${isAgent ? 'msg-agent' : 'msg-client'}">
                            <span>${msg.text}</span>
                            <span class="text-[9px] block text-right mt-1 opacity-70">${time}</span>
                        </div>
                    </div>`;
                msgContainer.insertAdjacentHTML('beforeend', html);
                msgContainer.scrollTop = msgContainer.scrollHeight;
            });
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !activeChatId) return;
            input.value = '';
            input.style.height = '';
            const timestamp = firebase.database.ServerValue.TIMESTAMP;
            await db.ref(`live_support_chats/${activeChatId}/messages`).push({
                sender: 'agent', text: text, timestamp: timestamp
            });
            await db.ref(`live_support_chats/${activeChatId}`).update({
                lastMessage: text, lastActivity: timestamp
            });
        }

        async function resolveChat() {
            if(!activeChatId || !confirm("Resolve this ticket?")) return;
            await db.ref(`live_support_chats/${activeChatId}`).update({ status: 'resolved' });
            await db.ref(`live_support_chats/${activeChatId}/messages`).push({
                sender: 'system', text: "Ticket resolved.", timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            openChat(activeChatId);
        }

        function logoutAgent() { location.reload(); }
        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('mobile-back-btn').classList.add('hidden');
        }
    </script>
</body>
</html>
